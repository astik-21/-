<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows 8 Start Screen</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --tile: 120px;       /* базовый размер маленькой плитки */
      --gap: 8px;
    }

    body {
      background: url('https://la.by/sites/default/files/news/windows-8.jpg') center/cover no-repeat fixed;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      min-height: 100vh;
      overflow-x: auto;
      overflow-y: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px 10px;
      position: sticky;
      top: 0;
      left: 0;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(4px);
      z-index: 10;
      gap: 16px;
    }

    .header .start {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 1px;
    }

    .header .user {
      font-size: 18px;
      font-weight: 300;
      opacity: 0.9;
    }

    .start-screen {
      display: flex;
      gap: 40px;
      padding: 20px 40px 40px;
      width: max-content;
      min-height: calc(100vh - 80px);
      align-items: flex-start;
    }

    .group {
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }

    .tiles {
      display: grid;
      gap: var(--gap);
      grid-auto-flow: dense;
    }

    .tile {
      background: #0078d7;
      border-radius: 0;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
      user-select: none;
    }

    .tile:hover {
      transform: scale(1.03);
      filter: brightness(1.15);
      z-index: 1;
    }

    .tile:active {
      transform: scale(0.97);
    }

    /* Размеры плиток через переменную --tile */
    .tile.small {
      width: var(--tile);
      height: var(--tile);
      grid-column: span 1;
      grid-row: span 1;
    }

    .tile.wide {
      width: calc(var(--tile) * 2 + var(--gap));
      height: var(--tile);
      grid-column: span 2;
      grid-row: span 1;
    }

    .tile.large {
      width: calc(var(--tile) * 2 + var(--gap));
      height: calc(var(--tile) * 2 + var(--gap));
      grid-column: span 2;
      grid-row: span 2;
    }

    .pink    { background: #e91e63; }
    .orange  { background: #ff5722; }
    .yellow  { background: #ffc107; }
    .green   { background: #4caf50; }
    .teal    { background: #009688; }
    .cyan    { background: #00bcd4; }
    .blue    { background: #2196f3; }
    .indigo  { background: #3f51b5; }
    .purple  { background: #9c27b0; }
    .red     { background: #f44336; }
    .lime    { background: #cddc39; }
    .amber   { background: #ff9800; }

    ::-webkit-scrollbar {
      height: 12px;
      width: 12px;
    }
    ::-webkit-scrollbar-track {
      background: #2d2d2d;
    }
    ::-webkit-scrollbar-thumb {
      background: #5a5a5a;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #7a7a7a;
    }

    /* ===== Адаптивность ===== */

    /* Планшеты и небольшие ноутбуки */
    @media (max-width: 1200px) {
      :root {
        --tile: 100px;
        --gap: 6px;
      }
      .start-screen {
        gap: 24px;
        padding: 16px 24px 24px;
      }
      .header {
        padding: 16px 24px 8px;
      }
    }

    /* Планшеты в портретной ориентации */
    @media (max-width: 900px) {
      :root {
        --tile: 88px;
        --gap: 6px;
      }
      .start-screen {
        gap: 18px;
        padding: 12px 16px 20px;
      }
    }

    /* Телефоны */
    @media (max-width: 600px) {
      :root {
        --tile: 72px;
        --gap: 5px;
      }

      .header {
        padding: 12px 14px 6px;
      }
      .header .start {
        font-size: 22px;
      }
      .header .user {
        font-size: 15px;
      }

      .start-screen {
        gap: 12px;
        padding: 10px 12px 16px;
        min-height: calc(100vh - 56px);
      }

      /* На телефоне группы идут в одну колонку,
         а плитки внутри группы перестраиваются в 2 колонки */
      .start-screen {
        flex-direction: column;
        width: 100%;
      }

      .group {
        width: 100%;
      }

      .tiles {
        grid-template-columns: repeat(2, var(--tile)) !important;
        justify-content: start;
      }

      /* На телефоне wide и large не выходят за 2 колонки */
      .tile.wide {
        width: calc(var(--tile) * 2 + var(--gap));
      }
      .tile.large {
        width: calc(var(--tile) * 2 + var(--gap));
        height: calc(var(--tile) * 2 + var(--gap));
      }
    }

    /* Очень узкие телефоны */
    @media (max-width: 380px) {
      :root {
        --tile: 64px;
        --gap: 4px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="start">Пуск</div>
    <div class="user">User</div>
  </header>

  <div class="start-screen">
    <!-- Группа 1: Розовые -->
    <div class="group">
      <div class="tiles" style="grid-template-columns: repeat(2, var(--tile));">
        <div class="tile small pink"></div>
        <div class="tile small pink"></div>
        <div class="tile small pink"></div>
        <div class="tile small pink"></div>
        <div class="tile wide pink"></div>
        <div class="tile small pink"></div>
        <div class="tile small pink"></div>
        <div class="tile small pink"></div>
        <div class="tile small pink"></div>
      </div>
    </div>

    <!-- Группа 2: Оранжевые -->
    <div class="group">
      <div class="tiles" style="grid-template-columns: repeat(4, var(--tile));">
        <div class="tile small orange"></div>
        <div class="tile small orange"></div>
        <div class="tile small orange"></div>
        <div class="tile small orange"></div>
        <div class="tile small orange"></div>
        <div class="tile small orange"></div>
        <div class="tile small orange"></div>
        <div class="tile small orange"></div>
        <div class="tile wide orange"></div>
        <div class="tile small orange"></div>
        <div class="tile small orange"></div>
        <div class="tile wide orange"></div>
        <div class="tile small orange"></div>
        <div class="tile small orange"></div>
      </div>
    </div>

    <!-- Группа 3: Жёлтые -->
    <div class="group">
      <div class="tiles" style="grid-template-columns: repeat(2, var(--tile));">
        <div class="tile small yellow"></div>
        <div class="tile small yellow"></div>
        <div class="tile small yellow"></div>
        <div class="tile small yellow"></div>
        <div class="tile small yellow"></div>
        <div class="tile small yellow"></div>
      </div>
    </div>

    <!-- Группа 4: Зелёные -->
    <div class="group">
      <div class="tiles" style="grid-template-columns: repeat(2, var(--tile));">
        <div class="tile small green"></div>
        <div class="tile small green"></div>
        <div class="tile large green"></div>
        <div class="tile small green"></div>
        <div class="tile small green"></div>
        <div class="tile small green"></div>
        <div class="tile small green"></div>
      </div>
    </div>

    <!-- Группа 5: Бирюзовые -->
    <div class="group">
      <div class="tiles" style="grid-template-columns: repeat(4, var(--tile));">
        <div class="tile small teal"></div>
        <div class="tile small teal"></div>
        <div class="tile small teal"></div>
        <div class="tile wide teal"></div>
        <div class="tile small teal"></div>
        <div class="tile small teal"></div>
        <div class="tile small teal"></div>
        <div class="tile small teal"></div>
        <div class="tile small teal"></div>
        <div class="tile small teal"></div>
        <div class="tile large teal"></div>
        <div class="tile small teal"></div>
      </div>
    </div>

    <!-- Группа 6: Синие -->
    <div class="group">
      <div class="tiles" style="grid-template-columns: var(--tile);">
        <div class="tile small blue"></div>
        <div class="tile small blue"></div>
        <div class="tile small blue"></div>
        <div class="tile small blue"></div>
        <div class="tile small blue"></div>
      </div>
    </div>
  </div>
</body>
</html>
